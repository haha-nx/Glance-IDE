name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to attach binaries to (e.g. v0.1.4)'
        required: false
        default: 'v0.1.4'

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare GitHub Release & Notes
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract release notes and create/update Release
        id: meta
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name || 'v0.1.4' }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          node scripts/release-notes.mjs "$TAG" release-notes.md
          echo "=== Release Notes ($TAG) ==="
          cat release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Glance IDE $TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --title "Glance IDE $TAG" --notes-file release-notes.md
          fi

  build-macos:
    name: Build macOS Installer
    needs: prepare-release
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        run: npm install

      - name: Build Tauri macOS application
        run: |
          npm run build
          npm run tauri build -- --target universal-apple-darwin || npm run tauri build

      - name: Fix macOS bundle & package in-place tar.gz / dmg
        run: |
          TAG="${{ needs.prepare-release.outputs.tag }}"
          VER="${TAG#v}"
          APP_PATH="$(find src-tauri/target -maxdepth 6 -type d -name 'Glance IDE.app' | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "Glance IDE.app not found"
            exit 1
          fi
          bash scripts/fix-macos-bundle.sh "$APP_PATH"
          BUNDLE_DIR="$(dirname "$APP_PATH")"
          mkdir -p release-artifacts
          tar -C "$BUNDLE_DIR" -czf "release-artifacts/Glance.IDE_${VER}_universal.app.tar.gz" "Glance IDE.app"
          DMG_STAGING="$(mktemp -d)"
          cp -R "$APP_PATH" "$DMG_STAGING/"
          ln -sfn /Applications "$DMG_STAGING/Applications"
          hdiutil create -volname "Glance IDE" -srcfolder "$DMG_STAGING" -ov -format UDZO "release-artifacts/Glance.IDE_${VER}_universal.dmg"
          rm -rf "$DMG_STAGING"

      - name: Upload macOS artifacts to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.prepare-release.outputs.tag }}"
          echo "Target release tag: $TAG"
          find release-artifacts -maxdepth 1 -type f | while read -r file; do
            echo "Uploading $file..."
            gh release upload "$TAG" "$file" --clobber
          done

  build-windows:
    name: Build Windows Installer
    needs: prepare-release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build Tauri Windows application
        run: |
          npm run build
          npm run tauri build

      - name: Upload Windows artifacts to Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ needs.prepare-release.outputs.tag }}"
          Get-ChildItem -Path "src-tauri/target" -Recurse -Include "*-setup.exe","*.msi" | ForEach-Object {
            Write-Host "Uploading $($_.FullName)..."
            gh release upload $tag $_.FullName --clobber
          }
