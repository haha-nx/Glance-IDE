name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck & production build
        run: npm run check

  rust:
    name: Rust Check, Clippy & Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Tauri system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config

      - name: Install Rust toolchain & clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Ensure frontend dist placeholder exists
        shell: bash
        run: mkdir -p dist && touch dist/index.html

      - name: Run Rust unit tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Check integration test compilation
        working-directory: src-tauri
        run: cargo check --tests

      - name: Run Clippy lints
        working-directory: src-tauri
        run: cargo clippy --all-targets
