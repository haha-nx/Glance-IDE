name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to attach binaries to (e.g. v0.1.5)'
        required: false
        default: 'v0.1.5'

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare GitHub Release & Notes
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract release notes and create/update Release
        id: meta
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name || 'v0.1.5' }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          node scripts/release-notes.mjs "$TAG" release-notes.md
          echo "=== Release Notes ($TAG) ==="
          cat release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Glance IDE $TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --draft --title "Glance IDE $TAG" --notes-file release-notes.md
          fi

  build-macos:
    name: Build macOS Installer
    needs: prepare-release
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri macOS application
        run: |
          npm run build
          npm run tauri build -- --target universal-apple-darwin

      - name: Fix macOS bundle & package in-place tar.gz / dmg
        run: |
          TAG="${{ needs.prepare-release.outputs.tag }}"
          VER="${TAG#v}"
          APP_PATH="$(find src-tauri/target -maxdepth 6 -type d -name 'Glance IDE.app' | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "Glance IDE.app not found"
            exit 1
          fi
          bash scripts/fix-macos-bundle.sh "$APP_PATH"
          BUNDLE_DIR="$(dirname "$APP_PATH")"
          mkdir -p release-artifacts
          tar -C "$BUNDLE_DIR" -czf "release-artifacts/Glance.IDE_${VER}_universal.app.tar.gz" "Glance IDE.app"
          DMG_STAGING="$(mktemp -d)"
          cp -R "$APP_PATH" "$DMG_STAGING/"
          ln -sfn /Applications "$DMG_STAGING/Applications"
          hdiutil create -volname "Glance IDE" -srcfolder "$DMG_STAGING" -ov -format UDZO "release-artifacts/Glance.IDE_${VER}_universal.dmg"
          rm -rf "$DMG_STAGING"

      - name: Upload macOS workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-artifacts
          path: release-artifacts/*
          if-no-files-found: error

  build-windows:
    name: Build Windows Installer
    needs: prepare-release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri Windows application
        run: |
          npm run build
          npm run tauri build

      - name: Collect Windows installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          $files = Get-ChildItem -Path "src-tauri/target" -Recurse -Include "*-setup.exe","*.msi"
          if ($files.Count -eq 0) {
            throw "No Windows installers found under src-tauri/target"
          }
          foreach ($file in $files) {
            Copy-Item $file.FullName -Destination release-artifacts/ -Force
          }

      - name: Upload Windows workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-artifacts
          path: release-artifacts/*
          if-no-files-found: error

  publish-release:
    name: Compute Checksums & Publish Release
    needs: [prepare-release, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: staging
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: |
          cd staging
          rm -f SHA256SUMS.txt
          LC_ALL=C
          for f in *; do
            [ -f "$f" ] && sha256sum "$f" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt

      - name: Upload assets & publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.prepare-release.outputs.tag }}"
          gh release upload "$TAG" staging/* --clobber
          gh release edit "$TAG" --draft=false
